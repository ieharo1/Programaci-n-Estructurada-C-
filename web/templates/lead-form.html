<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 12px 20px; display: block; border-left: 3px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background: #34495e; border-left-color: #3498db; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center border-bottom border-secondary">
                    <i class="bi bi-people-fill text-white display-6"></i>
                    <h5 class="text-white mt-2">LeadFlowCRM</h5>
                </div>
                <nav class="mt-3">
                    <a href="/dashboard"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                    <a href="/dashboard/leads" class="active"><i class="bi bi-person-lines-fill me-2"></i> Leads</a>
                    <a href="/dashboard/users"><i class="bi bi-people me-2"></i> Usuarios</a>
                    <a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i> Salir</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <a href="/dashboard/leads" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
                        <h2 class="d-inline-block ms-2 mb-0" id="formTitle">Nuevo Lead</h2>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body">
                        <form id="leadForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre *</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email *</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Teléfono</label>
                                    <input type="text" class="form-control" id="phone">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Empresa</label>
                                    <input type="text" class="form-control" id="company">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Cargo</label>
                                    <input type="text" class="form-control" id="position">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Estado</label>
                                    <select class="form-select" id="status">
                                        <option value="new">Nuevo</option>
                                        <option value="contacted">Contactado</option>
                                        <option value="qualified">Calificado</option>
                                        <option value="proposal">Propuesta</option>
                                        <option value="negotiation">Negociación</option>
                                        <option value="won">Ganado</option>
                                        <option value="lost">Perdido</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Fuente</label>
                                    <select class="form-select" id="source">
                                        <option value="web">Web</option>
                                        <option value="referral">Referido</option>
                                        <option value="social">Redes Sociales</option>
                                        <option value="ads">Publicidad</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Valor Estimado ($)</label>
                                    <input type="number" class="form-control" id="value" step="0.01" value="0">
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label class="form-label">Notas</label>
                                    <textarea class="form-control" id="notes" rows="3"></textarea>
                                </div>
                            </div>
                            <div class="text-end">
                                <a href="/dashboard/leads" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api';
        let token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';
        const headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

        const pathParts = window.location.pathname.split('/');
        const isEdit = pathParts.includes('edit');
        const leadId = isEdit ? pathParts[pathParts.length - 2] : null;

        if (isEdit) {
            document.getElementById('formTitle').textContent = 'Editar Lead';
            loadLead();
        }

        async function loadLead() {
            try {
                const res = await fetch(API_URL + '/leads/' + leadId, { headers });
                const lead = await res.json();
                document.getElementById('name').value = lead.name;
                document.getElementById('email').value = lead.email;
                document.getElementById('phone').value = lead.phone || '';
                document.getElementById('company').value = lead.company || '';
                document.getElementById('position').value = lead.position || '';
                document.getElementById('status').value = lead.status;
                document.getElementById('source').value = lead.source || 'web';
                document.getElementById('value').value = lead.value || 0;
                document.getElementById('notes').value = lead.notes || '';
            } catch (err) { console.error(err); }
        }

        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                company: document.getElementById('company').value,
                position: document.getElementById('position').value,
                status: document.getElementById('status').value,
                source: document.getElementById('source').value,
                value: parseFloat(document.getElementById('value').value) || 0,
                notes: document.getElementById('notes').value
            };

            try {
                const url = isEdit ? API_URL + '/leads/' + leadId : API_URL + '/leads';
                const method = isEdit ? 'PUT' : 'POST';
                const res = await fetch(url, { method, headers, body: JSON.stringify(data) });
                if (res.ok) {
                    window.location.href = '/dashboard/leads';
                } else {
                    alert('Error al guardar');
                }
            } catch (err) { alert('Error de conexión'); }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '/login';
        });
    </script>
</body>
</html>
