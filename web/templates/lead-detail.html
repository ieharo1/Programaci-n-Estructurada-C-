<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #2c3e50; }
        .sidebar a { color: #ecf0f1; text-decoration: none; padding: 12px 20px; display: block; border-left: 3px solid transparent; }
        .sidebar a:hover, .sidebar a.active { background: #34495e; border-left-color: #3498db; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-center border-bottom border-secondary">
                    <i class="bi bi-people-fill text-white display-6"></i>
                    <h5 class="text-white mt-2">LeadFlowCRM</h5>
                </div>
                <nav class="mt-3">
                    <a href="/dashboard"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a>
                    <a href="/dashboard/leads" class="active"><i class="bi bi-person-lines-fill me-2"></i> Leads</a>
                    <a href="/dashboard/users"><i class="bi bi-people me-2"></i> Usuarios</a>
                    <a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right me-2"></i> Salir</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <a href="/dashboard/leads" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
                        <h2 class="d-inline-block ms-2 mb-0">Detalle del Lead</h2>
                    </div>
                    <div>
                        <a id="editBtn" class="btn btn-warning"><i class="bi bi-pencil"></i> Editar</a>
                        <button class="btn btn-danger" onclick="deleteLead()"><i class="bi bi-trash"></i> Eliminar</button>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-8">
                        <div class="card mb-4">
                            <div class="card-header"><h5 class="mb-0"><i class="bi bi-person"></i> Información del Lead</h5></div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Nombre</label>
                                        <p class="mb-0 fw-bold" id="leadName">-</p>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Email</label>
                                        <p class="mb-0" id="leadEmail">-</p>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Teléfono</label>
                                        <p class="mb-0" id="leadPhone">-</p>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Empresa</label>
                                        <p class="mb-0" id="leadCompany">-</p>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Cargo</label>
                                        <p class="mb-0" id="leadPosition">-</p>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Estado</label>
                                        <p class="mb-0"><span class="badge bg-primary" id="leadStatus">-</span></p>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Fuente</label>
                                        <p class="mb-0" id="leadSource">-</p>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label text-muted">Valor</label>
                                        <p class="mb-0 fw-bold text-success" id="leadValue">$0</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0"><i class="bi bi-journal-text"></i> Notas</h5>
                                <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#noteModal">
                                    <i class="bi bi-plus-lg"></i> Nueva Nota
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="notesList"></div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-header"><h5 class="mb-0"><i class="bi bi-clock-history"></i> Historial</h5></div>
                            <div class="card-body">
                                <div id="historyList"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-header"><h5 class="mb-0"><i class="bi bi-pencil-square"></i> Actualizar Estado</h5></div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Nuevo Estado</label>
                                    <select class="form-select" id="updateStatus">
                                        <option value="new">Nuevo</option>
                                        <option value="contacted">Contactado</option>
                                        <option value="qualified">Calificado</option>
                                        <option value="proposal">Propuesta</option>
                                        <option value="negotiation">Negociación</option>
                                        <option value="won">Ganado</option>
                                        <option value="lost">Perdido</option>
                                    </select>
                                </div>
                                <button class="btn btn-primary w-100" onclick="updateStatus()">Actualizar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="noteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nueva Nota</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <textarea class="form-control" id="noteContent" rows="4" placeholder="Escriba su nota..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="addNote()">Guardar Nota</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api';
        let token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';
        const headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
        const leadId = window.location.pathname.split('/').pop();

        async function loadLead() {
            try {
                const res = await fetch(API_URL + '/leads/' + leadId, { headers });
                const lead = await res.json();
                document.getElementById('leadName').textContent = lead.name;
                document.getElementById('leadEmail').textContent = lead.email;
                document.getElementById('leadPhone').textContent = lead.phone || '-';
                document.getElementById('leadCompany').textContent = lead.company || '-';
                document.getElementById('leadPosition').textContent = lead.position || '-';
                document.getElementById('leadStatus').textContent = lead.status;
                document.getElementById('leadStatus').className = 'badge bg-' + getStatusColor(lead.status);
                document.getElementById('leadSource').textContent = lead.source || '-';
                document.getElementById('leadValue').textContent = '$' + (lead.value || 0).toLocaleString();
                document.getElementById('updateStatus').value = lead.status;
                document.getElementById('editBtn').href = '/dashboard/leads/' + leadId + '/edit';
                loadNotes();
                loadHistory();
            } catch (err) { console.error(err); }
        }

        function getStatusColor(status) {
            const colors = { new: 'primary', contacted: 'info', qualified: 'warning', proposal: 'secondary', negotiation: 'primary', won: 'success', lost: 'danger' };
            return colors[status] || 'secondary';
        }

        async function loadNotes() {
            const res = await fetch(API_URL + '/leads/' + leadId + '/notes', { headers });
            const notes = await res.json();
            document.getElementById('notesList').innerHTML = notes.length ? notes.map(n => `
                <div class="border-bottom pb-2 mb-2">
                    <p class="mb-1">${n.content}</p>
                    <small class="text-muted">${new Date(n.created_at).toLocaleString()}</small>
                </div>
            `).join('') : '<p class="text-muted">No hay notas</p>';
        }

        async function loadHistory() {
            const res = await fetch(API_URL + '/leads/' + leadId + '/history', { headers });
            const history = await res.json();
            document.getElementById('historyList').innerHTML = history.length ? history.map(h => `
                <div class="border-bottom pb-2 mb-2">
                    <p class="mb-1"><strong>${h.action}</strong>: ${h.description}</p>
                    <small class="text-muted">${new Date(h.created_at).toLocaleString()}</small>
                </div>
            `).join('') : '<p class="text-muted">No hay historial</p>';
        }

        async function addNote() {
            const content = document.getElementById('noteContent').value;
            if (!content) return;
            await fetch(API_URL + '/leads/' + leadId + '/notes', {
                method: 'POST',
                headers,
                body: JSON.stringify({ content })
            });
            $('#noteModal').modal('hide');
            document.getElementById('noteContent').value = '';
            loadNotes();
        }

        async function updateStatus() {
            const status = document.getElementById('updateStatus').value;
            await fetch(API_URL + '/leads/' + leadId, {
                method: 'PUT',
                headers,
                body: JSON.stringify({ status })
            });
            loadLead();
        }

        async function deleteLead() {
            if (!confirm('¿Está seguro de eliminar este lead?')) return;
            await fetch(API_URL + '/leads/' + leadId, { method: 'DELETE', headers });
            window.location.href = '/dashboard/leads';
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = '/login';
        });

        loadLead();
    </script>
</body>
</html>
